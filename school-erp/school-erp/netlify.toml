# Netlify configuration for School ERP (frontend only, no backend)

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# API calls return a clean 404 instead of the HTML page (no backend connected)
[[redirects]]
  from   = "/api/*"
  to     = "/api-not-connected"
  status = 404
  force  = true

# SPA fallback for React Router
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify configuration for School ERP (frontend only).
# The Node/Express backend must be hosted separately (Render, Railway, Fly.io, etc.).

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# --- API & uploads proxy to your hosted backend -------------------------
# REPLACE https://YOUR-BACKEND-URL with your deployed backend (no trailing slash).
# These must come BEFORE the SPA fallback.
[[redirects]]
  from   = "/api/*"
  to     = "https://YOUR-BACKEND-URL/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/uploads/*"
  to     = "https://YOUR-BACKEND-URL/uploads/:splat"
  status = 200
  force  = true

# --- SPA fallback for React Router --------------------------------------
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# --- Headers ------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
